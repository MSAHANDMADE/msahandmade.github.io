<style>

body{
  background:linear-gradient(180deg,#fbf7ff 0%, #eef6ff 100%);
  font-family:system-ui;
}

/* header */
.header{
position:sticky;
top:0;
background:#fff;
border-bottom:1px solid #eee;
z-index:50;
}

#main-nav{
max-width:1100px;
margin:auto;
padding:10px 16px;
display:flex;
gap:18px;
align-items:center;
}

.spacer{flex:1}

.cart-pill{
background:#f5f5f5;
padding:8px 12px;
border-radius:999px;
font-weight:700;
}

/* container */

.wrap{
max-width:1100px;
margin:auto;
padding:20px 16px;
}

/* titles */

.section-title{
font-size:22px;
margin:30px 0 14px;
font-weight:800;
color:#0a2230;
}

/* grid */

.grid{
display:grid;
grid-template-columns:repeat(12,1fr);
gap:16px;
}

.card{
grid-column:span 12;
background:#fff;
border-radius:14px;
box-shadow:0 8px 22px rgba(0,0,0,.06);
overflow:hidden;
position:relative;
}

@media(min-width:720px){
.card{grid-column:span 6}
}

@media(min-width:1024px){
.card{grid-column:span 4}
}

.thumb{
width:100%;
aspect-ratio:4/3;
object-fit:cover;
cursor:pointer;
}

.body{
padding:12px;
}

.price{
font-weight:700;
}

.desc{
font-size:.92rem;
color:#555;
margin:6px 0;
}

/* stock badge */

.badge-stock{
position:absolute;
top:10px;
left:10px;
background:#000;
color:#fff;
padding:6px 10px;
border-radius:999px;
font-weight:800;
font-size:12px;
}

/* button */

.btn{
background:#0f3a2e;
color:#fff;
border:0;
padding:10px;
border-radius:10px;
font-weight:800;
cursor:pointer;
width:100%;
}

.btn:disabled{
opacity:.5;
cursor:not-allowed;
}

</style>

<script src="cart.js"></script>

</head>
<body>

<header class="header">

<nav id="main-nav">

<a href="index.html">Acasă</a>
<a href="produse.html"><b>Produse</b></a>
<a href="despre.html">Despre</a>
<a href="contact.html">Contact</a>

<span class="spacer"></span>

<a href="cos.html" class="cart-pill">
🛒 <span id="cart-count">0</span>
</a>

</nav>

</header>

<main class="wrap">

<h1>Produsele noastre</h1>

<div id="available-section">

<div class="section-title">
Disponibile
</div>

<div class="grid" id="available-grid"></div>

</div>

<div id="out-section">

<div class="section-title">
Stoc epuizat
</div>

<div class="grid" id="out-grid"></div>

</div>

</main>

<script>

const OUT_OF_STOCK = new Set([
"coronita1",
"coronita2"
]);

const PRODUCTS = [

{
id:'coronita1',
name:'Coroniță Crăciun – roșu & auriu',
price:35,
image:'images/coronita1.png',
desc:'Coroniță decorativă premium.'
},

{
id:'coronita2',
name:'Coroniță Crăciun – albastru & argintiu',
price:35,
image:'images/coronita2.png',
desc:'Coroniță decorativă premium.'
},

{
id:'sarut',
name:'Sărut',
price:33,
image:'images/sarut.jpg',
desc:'Lumânare handmade.'
},

{
id:'ingeras',
name:'Îngeraș',
price:5,
image:'images/ingeras.png',
desc:'Lumânare handmade.'
},

{
id:'floricele',
name:'Floricele',
price:5,
image:'images/floricele.png',
desc:'Lumânare handmade.'
}

];

function createCard(p,out){

return `

<div class="card">

${out ? `<div class="badge-stock">STOC EPUIZAT</div>` : ``}

<img class="thumb" src="${p.image}">

<div class="body">

<div>${p.name}</div>

<div class="price">
${p.price} RON
</div>

<div class="desc">
${p.desc}
</div>

<button class="btn"
${out ? "disabled" : ""}
data-id="${p.id}"
>

${out ? "Stoc epuizat" : "Adaugă în coș"}

</button>

</div>

</div>

`;

}

function render(){

const availableGrid =
document.getElementById("available-grid");

const outGrid =
document.getElementById("out-grid");

availableGrid.innerHTML="";
outGrid.innerHTML="";

PRODUCTS.forEach(p=>{

const out = OUT_OF_STOCK.has(p.id);

if(out)
outGrid.innerHTML += createCard(p,true);

else
availableGrid.innerHTML += createCard(p,false);

});

}

document.addEventListener("DOMContentLoaded",render);

</script>

</body>
</html>
