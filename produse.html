<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Produse — MSA Handmade</title>

<link rel="stylesheet" href="styles.css">

<style>

body{
background:linear-gradient(180deg,#fbf7ff,#eef6ff);
}

.header{
position:sticky;
top:0;
background:#fff;
border-bottom:1px solid #eee;
z-index:100;
}

#main-nav{
max-width:1100px;
margin:auto;
padding:12px 16px;
display:flex;
gap:18px;
align-items:center;
}

.spacer{flex:1}

.cart-pill{
background:#f5f5f5;
padding:8px 12px;
border-radius:999px;
font-weight:700;
}

.wrap{
max-width:1100px;
margin:auto;
padding:20px;
}

.section-title{
margin-top:40px;
margin-bottom:15px;
font-size:24px;
font-weight:800;
}

.grid{
display:grid;
grid-template-columns:repeat(12,1fr);
gap:16px;
}

.card{
grid-column:span 12;
background:#fff;
border-radius:14px;
box-shadow:0 8px 22px rgba(0,0,0,.06);
overflow:hidden;
position:relative;
}

@media(min-width:720px){
.card{grid-column:span 6}
}

@media(min-width:1024px){
.card{grid-column:span 4}
}

.thumb{
width:100%;
aspect-ratio:4/3;
object-fit:cover;
cursor:pointer;
}

.body{
padding:12px;
}

.price{
font-weight:700;
}

.desc{
font-size:.9rem;
color:#555;
margin:6px 0;
}

.badge-stock{
position:absolute;
top:10px;
left:10px;
background:#000;
color:#fff;
padding:6px 10px;
border-radius:999px;
font-weight:800;
font-size:12px;
}

.btn{
background:#0f3a2e;
color:#fff;
border:0;
padding:10px;
border-radius:10px;
font-weight:800;
cursor:pointer;
width:100%;
}

.btn:disabled{
opacity:.5;
cursor:not-allowed;
}

</style>

<script src="cart.js"></script>

</head>
<body>

<header class="header">

<nav id="main-nav">

<a href="index.html">Acasă</a>
<a href="produse.html"><b>Produse</b></a>
<a href="despre.html">Despre</a>
<a href="contact.html">Contact</a>

<span class="spacer"></span>

<a href="cos.html" class="cart-pill">
🛒 <span id="cart-count">0</span>
</a>

</nav>

</header>

<main class="wrap">

<h1>Produsele noastre</h1>

<div class="section-title">Disponibile</div>
<div class="grid" id="available-grid"></div>

<div class="section-title">Stoc epuizat</div>
<div class="grid" id="out-grid"></div>

</main>

<script>

const OUT_OF_STOCK = new Set([
"coronita1",
"coronita2"
]);

const PRODUCTS = [

{ id:'coronita1', name:'Coroniță Crăciun – roșu & auriu', price:35, image:'images/coronita1.png', desc:'Strălucire caldă de sărbătoare.' },

{ id:'coronita2', name:'Coroniță Crăciun – albastru & argintiu', price:35, image:'images/coronita2.png', desc:'Eleganță rece, iernatică.' },

{ id:'sarut', name:'Sărut', price:33, image:'images/sarut.jpg', desc:'Două inimi, aceeași lumină.' },

{ id:'ingeras', name:'Îngeraș', price:5, image:'images/ingeras.png', desc:'Mic protector al casei tale.' },

{ id:'floricele', name:'Floricele', price:5, image:'images/floricele.png', desc:'Floricele delicate din ceară.' },

{ id:'moscraciun', name:'Moș Crăciun decorativ', price:19.99, image:'images/moscraciun.jpg', desc:'Figurină Moș Crăciun.' },

{ id:'family', name:'Family', price:11, image:'images/family.png', desc:'Simbol al armoniei.' },

{ id:'ruga', name:'Lumânare Rugă', price:24.99, image:'images/ruga.png', desc:'Simbol al protecției.' },

{ id:'isus', name:'Iisus', price:33, image:'images/isus.png', desc:'Detalii frumoase.' },

{ id:'buchet', name:'Buchet', price:29, image:'images/buchet.jpg', desc:'Flori din ceară.' },

{ id:'crin', name:'Crin', price:33, image:'images/crin.jpg', desc:'Formă florală elegantă.' },

{ id:'dans', name:'Dans', price:33, image:'images/dans.jpg', desc:'Siluete în mișcare.' },

{ id:'flori', name:'Flori', price:33, image:'images/flori.jpg', desc:'Suport ipsos.' },

{ id:'inger', name:'Înger', price:33, image:'images/inger.jpg', desc:'Simbol al protecției.' },

{ id:'logodna', name:'Logodnă', price:33, image:'images/logodna.jpg', desc:'Romantică și elegantă.' },

{ id:'peisaj', name:'Peisaj', price:99, image:'images/peisaj.jpg', desc:'Peisaj turnat în ceară.' },

{ id:'peisajiarna', name:'Peisaj de iarnă', price:99, image:'images/peisajiarna.jpg', desc:'Farmecul iernii.' },

{ id:'indragostiti', name:'Îndrăgostiți', price:99, image:'images/indragostiti.jpg', desc:'Două inimi.' }

];

function createCard(p,out){

return `
<div class="card">

${out ? `<div class="badge-stock">STOC EPUIZAT</div>` : ""}

<img src="${p.image}" class="thumb">

<div class="body">

<div>${p.name}</div>

<div class="price">${p.price} RON</div>

<div class="desc">${p.desc}</div>

<button class="btn"
${out ? "disabled" : ""}
>
${out ? "Stoc epuizat" : "Adaugă în coș"}
</button>

</div>
</div>
`;

}

function render(){

const available=document.getElementById("available-grid");
const out=document.getElementById("out-grid");

available.innerHTML="";
out.innerHTML="";

PRODUCTS.forEach(p=>{

if(OUT_OF_STOCK.has(p.id))
out.innerHTML+=createCard(p,true);

else
available.innerHTML+=createCard(p,false);

});

}

document.addEventListener("DOMContentLoaded",render);

</script>

</body>
</html>
